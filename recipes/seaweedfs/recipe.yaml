apiVersion: kubepkg.dev/v1
kind: Recipe
metadata:
  name: seaweedfs
  annotations:
    kubepkg.dev/description: "S3-compatible object storage for datasets, checkpoints and model weights"
    kubepkg.dev/home: https://github.com/seaweedfs/seaweedfs
spec:
  version: 4.48.0
  build: 1
  sources:
    upstream:
      chart:
        repository: https://seaweedfs.github.io/seaweedfs/helm
        name: seaweedfs
        version: "4.48.0"
        digest: sha256:fa9beb4b68ee1e56129779643194968210381a33caf47fc177fd17d43efb686e
  charts:
    seaweedfs:
      from: [upstream]
      values:
        # One master, one volume server and a filer with the S3 gateway,
        # all on volumes of the cluster's default StorageClass rather than
        # host paths, which neither follow a rescheduled pod nor pass the
        # baseline Pod Security level. Replicas and sizes grow with the use.
        master:
          replicas: 1
          data: {type: persistentVolumeClaim, size: 1Gi, storageClass: ""}
          logs: {type: emptyDir}
        volume:
          replicas: 1
          dataDirs:
            - {name: data1, type: persistentVolumeClaim, size: 50Gi, storageClass: "", maxVolumes: 0}
        filer:
          replicas: 1
          data: {type: persistentVolumeClaim, size: 5Gi, storageClass: ""}
          logs: {type: emptyDir}
          s3:
            enabled: true
  package:
    provides: [seaweedfs, object-storage, s3]
    crds: []
    images:   # what the charts run, pinned; add images an operator deploys on its own
      - docker.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    rollback:
      safe: false   # true once rolling back to the previous version is known not to lose data
    variants:
      - name: default
        components:
          - name: seaweedfs
            path: seaweedfs
            install: {namespace: seaweedfs}
