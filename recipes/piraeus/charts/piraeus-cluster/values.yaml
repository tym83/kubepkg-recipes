# Where volumes live on each node: a thin-provisioned pool of files, which
# needs nothing but a directory. Clusters with LVM can give an lvmThinPool
# instead (see the LinstorSatelliteConfiguration reference).
storagePool:
  name: pool1
  fileThinPool:
    directory: /var/lib/piraeus-datastore/pool1
# The StorageClass for replicated volumes; empty name: none.
storageClass:
  name: replicated
  replicas: 2
  default: false
# DRBD loaded by the node itself (kuberoot loads it at boot and then disables
# module loading): the operator does not try to build and load it.
drbdLoadedByTheNode: true
# Nodes run systemd, udev and D-Bus. Without them (kuberoot), the satellite
# drops the DRBD shutdown guard, a systemd unit, and the host's udev and
# D-Bus mounts; the pool of files does not use udev. Set true on systemd
# distributions to keep upstream's behaviour.
nodeHasSystemd: false
# Satellites on the node's network: DRBD's connections are made by the
# kernel module with the node's addresses, so with satellites on the pod
# network peers stay "Connecting" and volumes never get a second replica.
hostNetwork: true
