apiVersion: kubepkg.dev/v1alpha1
kind: Recipe
metadata:
  name: victoria-metrics
  annotations:
    kubepkg.dev/description: "Cluster monitoring: VictoriaMetrics, alerting rules, node metrics and Grafana with dashboards"
    kubepkg.dev/home: https://github.com/VictoriaMetrics/helm-charts
spec:
  version: 1.153.0
  build: 2
  sources:
    upstream:
      chart:
        repository: https://victoriametrics.github.io/helm-charts
        name: victoria-metrics-k8s-stack
        version: "0.95.0"
        digest: sha256:f7670802dbd92b0e0eb068eba0c9040461035b3170ba8a437f9a72613aafa3fa
    node-exporter:
      chart:
        repository: oci://ghcr.io/prometheus-community/charts
        name: prometheus-node-exporter
        version: "4.59.0"
        digest: sha256:32b555a5f523215c120b283bdf20977a78934291d2c84b572325de21724a4a2c
    scrapes:
      dir: charts/scrapes
  charts:
    victoria-metrics:
      from: [upstream]
      values:
        # Both come from their own packages.
        victoria-metrics-operator: {enabled: false}
        kube-state-metrics: {enabled: false}
        # node-exporter needs the host's network and process namespaces; it
        # runs as its own component in its own namespace, so the rest of the
        # stack stays under the default pod security level.
        prometheus-node-exporter: {enabled: false}
        # Upstream fetches alerting rules and dashboards from GitHub branches
        # in a post-install Job: an install that needs the internet and gets
        # different content on different days. Off until they are pinned in
        # the recipe.
        syncJob: {enabled: false}
        defaultRules: {enabled: false}
        defaultDashboards: {enabled: false}
        grafana:
          # The dashboard and datasource sidecars read ConfigMaps and Secrets
          # of their own namespace only; upstream grants it cluster-wide.
          rbac: {namespaced: true}
        kubelet:
          vmScrape:
            spec:
              # Upstream copies every label of the node onto every kubelet
              # and cAdvisor series. KubeVirt labels nodes with hundreds of
              # CPU features, and VictoriaMetrics then drops those series
              # for having too many labels: no container CPU or memory at
              # all. The node's name is what queries and dashboards use.
              relabelConfigs:
                - sourceLabels: [__meta_kubernetes_node_name]
                  targetLabel: node
                - sourceLabels: [__metrics_path__]
                  targetLabel: metrics_path
                - targetLabel: job
                  replacement: kubelet
    node-exporter:
      from: [node-exporter]
      values:
        service:
          labels: {jobLabel: node-exporter}
        extraArgs:
          - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
          - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
    scrapes:
      from: [scrapes]
  package:
    provides: [victoria-metrics, monitoring]
    crds: []
    rollback:
      safe: false   # VictoriaMetrics keeps its data across the version a rollback would return to
    variants:
      - name: default
        requires:
          - {package: victoria-metrics-operator, version: "~0.75"}
          - {package: kube-state-metrics, version: "^2"}
        components:
          - name: victoria-metrics
            path: victoria-metrics
            install: {namespace: monitoring}
          - name: node-exporter
            path: node-exporter
            # Reads the host through the host network and PID namespaces.
            install: {namespace: node-exporter, releaseName: node-exporter, privileged: true}
          - name: scrapes
            path: scrapes
            install: {namespace: monitoring, dependsOn: [victoria-metrics]}
