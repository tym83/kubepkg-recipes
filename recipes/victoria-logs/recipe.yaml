apiVersion: kubepkg.dev/v1alpha1
kind: Recipe
metadata:
  name: victoria-logs
  annotations:
    kubepkg.dev/description: "Cluster logs: VictoriaLogs storage and a Fluent Bit collector on every node"
    kubepkg.dev/home: https://docs.victoriametrics.com/victorialogs/
spec:
  version: 1.53.0
  build: 1
  sources:
    server:
      chart:
        repository: https://victoriametrics.github.io/helm-charts
        name: victoria-logs-single
        version: "0.13.10"
        digest: sha256:aa7bd2d4b5326322c9d73852b22adcc031bbbe848b8bcaf8afaea9800b6294a5
    collector:
      chart:
        repository: https://fluent.github.io/helm-charts
        name: fluent-bit
        version: "0.58.3"
        digest: sha256:99e025e461fa080e68dcfe65b8bc0bf64dd74d2c04b87cb910f9192fbf954f20
  charts:
    victoria-logs:
      from: [server]
      values:
        server:
          # A stable Service name for the collector to send to.
          fullnameOverride: victoria-logs
          retentionPeriod: 7d
          # Volumes without quotas (local-path) would otherwise grow until
          # the node's disk is full: older logs go first at 8 GiB of the
          # 10 GiB volume.
          retentionDiskSpaceUsage: 8
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
    fluent-bit:
      from: [collector]
      values:
        # At info it logs every delivery, and collects those lines too.
        logLevel: warn
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {memory: 128Mi}
        # Root is needed to read the node's log files; nothing else is.
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        # Container logs only: nodes without journald have nothing more to
        # offer, and nothing else from the host is mounted.
        daemonSetVolumes:
          - name: varlog
            hostPath: {path: /var/log}
        daemonSetVolumeMounts:
          - name: varlog
            mountPath: /var/log
            readOnly: true
        config:
          inputs: |
            [INPUT]
                Name tail
                Path /var/log/containers/*.log
                multiline.parser docker, cri
                Tag kube.*
                Mem_Buf_Limit 5MB
                Skip_Long_Lines On
          filters: |
            [FILTER]
                Name kubernetes
                Match kube.*
                Merge_Log On
                Keep_Log Off
                Labels Off
                Annotations Off
                K8S-Logging.Parser On
                K8S-Logging.Exclude On
            [FILTER]
                Name nest
                Match kube.*
                Operation lift
                Nested_under kubernetes
                Add_prefix kubernetes_
          outputs: |
            [OUTPUT]
                Name http
                Match kube.*
                Host victoria-logs.logging.svc
                Port 9428
                URI /insert/jsonline?_stream_fields=stream,kubernetes_namespace_name,kubernetes_pod_name,kubernetes_container_name&_msg_field=log,msg,message&_time_field=date
                Format json_lines
                Json_Date_Key date
                Json_Date_Format iso8601
                Retry_Limit False
  package:
    provides: [victoria-logs, logging]
    crds: []
    rollback:
      safe: false   # the storage format may change between releases
    variants:
      - name: default
        components:
          - name: victoria-logs
            path: victoria-logs
            install: {namespace: logging, releaseName: victoria-logs}
          - name: fluent-bit
            path: fluent-bit
            # The collector reads node log files through a host path.
            # Its own namespace: only the collector needs to be privileged.
            install: {namespace: logging-agent, releaseName: fluent-bit, privileged: true, dependsOn: [victoria-logs]}
