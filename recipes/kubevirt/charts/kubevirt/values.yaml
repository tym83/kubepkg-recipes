# emulation runs virtual machines without /dev/kvm, slowly: for clusters
# without hardware virtualization, such as CI and nested test clusters.
emulation: false
featureGates: []
imagePullPolicy: IfNotPresent
# Where virt-api, virt-controller and virt-operator's install job run.
# Unset, KubeVirt requires control-plane nodes, which clusters with a hosted
# control plane (managed and tenant clusters) do not have. Empty places them
# on any node; set a nodeSelector, affinity or tolerations to pin them.
infraNodePlacement: {}
