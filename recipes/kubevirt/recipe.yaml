apiVersion: kubepkg.dev/v1alpha1
kind: Recipe
metadata:
  name: kubevirt
  annotations:
    kubepkg.dev/description: Virtual machines on Kubernetes
    kubepkg.dev/home: https://kubevirt.io
spec:
  version: 1.9.0
  build: 7
  sources:
    operator:
      url: https://github.com/kubevirt/kubevirt/releases/download/v1.9.0/kubevirt-operator.yaml
      sha256: f11307caafc3c23ffedf9887d8beb5a4419e2694da242fa68f63d1ec820de2e0
    kubevirt:
      dir: charts/kubevirt
  charts:
    kubevirt-operator:
      from: [operator]
      exclude: [{kind: Namespace}]
      patches:
        # Upstream requires control-plane nodes for virt-operator, which
        # clusters with a hosted control plane (managed and tenant clusters)
        # do not have: it would never schedule. Keep the preference and
        # tolerations, drop the requirement.
        - kind: Deployment
          name: virt-operator
          merge:
            spec:
              template:
                spec:
                  affinity:
                    nodeAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution: null
    kubevirt:
      from: [kubevirt]
  package:
    provides: [kubevirt, "api:kubevirt.io/v1"]
    crds: [kubevirts.kubevirt.io]
    images:   # pinned with kubepkg images; operators deploy some of them on their own
      - quay.io/kubevirt/virt-api:v1.9.0@sha256:42341b1d52699f4bb87f3996151bafe2e3fe065e9146cc64a15959ddf7bf2c69
      - quay.io/kubevirt/virt-controller:v1.9.0@sha256:7c6034ab39b97c0bb2b31bab2aaf576b616a3d6e59777002d63e2f2bf51e73c2
      - quay.io/kubevirt/virt-exportproxy:v1.9.0@sha256:042443b8f58246623e440af59cd34c0627f843b6094c41794d16c98c8d0049ea
      - quay.io/kubevirt/virt-exportserver:v1.9.0@sha256:bf805f79151d689431f3e461ad77355acd04b16fe5bde88b00be772ae1edd06c
      - quay.io/kubevirt/virt-handler:v1.9.0@sha256:df9f2069924a28ba76f47e7f4fbd9a0be3aa13cfa004a59e7a708bbff2a90424
      - quay.io/kubevirt/virt-launcher:v1.9.0@sha256:f23102ca00bf12f7962021adfdfdad63c873b01a03001a6d20d5813950254b9c
      - quay.io/kubevirt/virt-operator:v1.9.0@sha256:d08b5b5ad1c0d694fad13279e44b44b6fad961aa7508acd53b87ce6ef468cbae
      - quay.io/kubevirt/virt-template-apiserver:v0.2.2@sha256:af326822d8907ce3c96a6458444f5af0f1e3f912215710eae3fa562c92a3470e
      - quay.io/kubevirt/virt-template-controller:v0.2.2@sha256:2cd0770ce24b40d742bd6bac438c55c886352366c90e8165c11b715b7cfd94c7
    rollback:
      safe: false   # KubeVirt does not support downgrades
    variants:
      - name: default
        requires:
          - {package: cdi, optional: true}   # disk images and DataVolumes; installed first when present
        components:
          - name: operator
            path: kubevirt-operator
            # The operator deploys virt-handler into this namespace: it runs
            # with the host's PID namespace and host paths, which the
            # baseline pod security level refuses.
            install: {namespace: kubevirt, privileged: true}
          - name: kubevirt
            path: kubevirt
            install:
              namespace: kubevirt
              dependsOn: [operator]
              # The chart only creates the KubeVirt resource; the operator
              # then deploys KubeVirt, which is ready when it reports Available.
              readyWhen:
                - {apiVersion: kubevirt.io/v1, kind: KubeVirt, name: kubevirt, condition: Available}
