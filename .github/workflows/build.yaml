name: build

on:
  pull_request:

permissions:
  contents: read

env:
  # The kubepkg commit recipes are built with; move it forward deliberately.
  KUBEPKG_REF: fb684a1f262a080764a30bed63ac92175402baa3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install kubepkg
        run: go install "github.com/tym83/kubepkg/cmd/kubepkg@${KUBEPKG_REF}"
      - name: Build every recipe
        run: scripts/build-all.sh
