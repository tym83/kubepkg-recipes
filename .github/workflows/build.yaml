name: build

on:
  pull_request:

permissions:
  contents: read

env:
  # The kubepkg commit recipes are built with; move it forward deliberately.
  KUBEPKG_REF: e64dfcfe25f4e76e2affba060c081e5d7563671b

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install kubepkg
        run: go install "github.com/tym83/kubepkg/cmd/kubepkg@${KUBEPKG_REF}"
      - name: Validate every recipe
        run: kubepkg validate recipes
      - name: Build every recipe
        run: scripts/build-all.sh
